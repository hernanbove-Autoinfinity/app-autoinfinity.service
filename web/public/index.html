<html lang="es">
<head>

<style>
/* Colores de la marca: gris oscuro y rojo */
:root{--bg:#f5f5f6;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ac:#d7101f;--pri:#2c2c2e;--ln:#e4e4e7;--wa:#b25a00;--rojo:#c40d1a}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--tx:#f2f2f2;--mu:#9a9aa0;--ac:#ff3b45;--pri:#48484a;--ln:#2c2c2e;--wa:#ffb340;--rojo:#ff5b5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;line-height:1.4;-webkit-text-size-adjust:100%}
.w{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}
h2{font-size:20px;margin:6px 0 14px}
p{margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;min-height:40px}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.marca img{height:44px;width:auto;display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.tap{cursor:pointer}
.km{font-size:34px;font-weight:700;letter-spacing:-.5px}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:14px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:14px;width:100%;cursor:pointer;display:block;text-align:center;text-decoration:none}
button:disabled{opacity:.6}
.btn{margin-bottom:10px;font-weight:600}
.p{background:var(--pri);color:#fff;font-weight:600}
.s{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:500}
.mini{width:auto;padding:8px 12px;font-size:14px;background:transparent;color:var(--tx);border:1px solid var(--ln)}
.big{padding:20px;font-size:18px;font-weight:700;background:var(--tx);color:var(--bg);margin:6px 0 10px}
.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.rojo{background:var(--rojo);color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.row .btn{padding:11px;font-size:15px;margin:0;flex:1}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin-bottom:10px}
.codigo{font-size:28px;letter-spacing:10px;text-align:center;font-weight:700}
label{font-size:14px;color:var(--mu);display:block;margin-bottom:4px}
.aviso{border-left:4px solid var(--wa);padding:10px 12px;margin-top:12px;background:var(--bg);border-radius:8px;font-size:15px}
.aviso a{color:var(--ac);font-weight:600}
.alerta{border-left:4px solid var(--rojo);background:var(--card);padding:12px 14px;border-radius:10px;margin-bottom:12px}
.badge{display:inline-block;color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700}
.err{color:var(--rojo);font-size:14px;min-height:20px;margin-bottom:6px}
.hide{display:none!important}
.bub{padding:12px 14px;border-radius:16px;margin:8px 0;max-width:88%}
.bub.infi{background:var(--card);border:1px solid var(--ln)}
.bub.cliente{background:var(--ac);color:#fff;margin-left:auto}
.foto{max-width:100%;border-radius:12px;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{width:auto;padding:9px 14px;border:1px solid var(--ac);color:var(--ac);background:transparent;font-size:15px}
.chip.on{background:var(--ac);color:#fff}
.btnfile{display:block;text-align:center;padding:13px;border-radius:14px;margin-bottom:10px;border:1px solid var(--ln);color:var(--ac);font-weight:600;cursor:pointer}
.btnfile.p{color:#fff;border:0}
.fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.env{border-top:1px solid var(--ln);padding:10px 0}
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0}
.stars button{width:auto;font-size:30px;background:none;padding:2px;color:var(--wa)}
details summary{cursor:pointer;font-weight:600}
.grupo{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 16px;margin-bottom:12px}
.grupo summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.grupo summary::-webkit-details-marker{display:none}
.cnt{background:var(--ac);color:#fff;border-radius:20px;padding:1px 9px;font-size:13px;margin-left:6px}
.linea{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
.linea b{font-weight:600;font-size:15px}
.reloj{color:var(--wa);font-weight:600}
.comp .cot{border-top:1px solid var(--ln);padding:12px 0}
.comp .cot.abierta{background:var(--bg);margin:0 -16px;padding:12px 16px}
.comp .precio{font-size:17px;white-space:nowrap}
.comp .of{font-size:11px;font-weight:700;color:var(--card);background:var(--tx);border-radius:6px;padding:1px 6px;vertical-align:2px}
.comp .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.comp .tags span{font-size:12px;font-weight:600;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:1px 8px}
.comp .det{margin-top:8px}
.comp .det p{margin:6px 0}
.chip.mini2{font-size:13px;padding:6px 10px}
.pie{display:flex;gap:8px;margin-top:14px}
.pie button{flex:1;padding:12px;font-size:15px}
.menu button{margin-bottom:8px;text-align:left;padding:14px 16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:10}
#modal .card{width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding-bottom:calc(30px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="w" id="app"><p class="mu">Cargando…</p></div>
<div id="modal" class="hide"><div class="card" id="mc"></div></div>

<script>
// Si algo falla, se muestra en pantalla en vez de quedar en blanco
window.onerror = function (msg, src, linea, col) {
  var d = document.getElementById('app');
  if (d) d.innerHTML = '<div class="card"><b>Algo falló al cargar la app</b><p class="mu">Recargá la página. Si sigue, mandanos esta captura:</p>' +
    '<p style="font-family:monospace;font-size:13px;word-break:break-all">' + String(msg).replace(/</g, '&lt;') + ' (línea ' + linea + ':' + col + ')</p></div>';
};
</script>
<script src="/vendor/supabase.js"></script>
<script>
let SB = null, D = { autos: [], perfil: {}, activos: [], admin: false }, INFI = null, CASO = null, ORDEN = 'precio', ESTRELLAS = 0, LOGIN_EMAIL = '';

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('es-AR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n ? '$' + fmt(n) : 'A consultar';
const digitos = t => String(t || '').replace(/\D/g, '');
const telLink = t => 'tel:' + digitos(t);
function waLink(t, msg) {
  let d = digitos(t);
  if (!d.startsWith('54')) d = '549' + d.replace(/^0/, '');
  return 'https://wa.me/' + d + (msg ? '?text=' + encodeURIComponent(msg) : '');
}
const colorUrg = u => u === 'alta' ? 'var(--rojo)' : u === 'media' ? 'var(--wa)' : 'var(--ac)';
const textoUrg = u => u === 'alta' ? 'Gravedad alta' : u === 'media' ? 'Gravedad media' : 'Gravedad baja';

// ================= SERVIDOR =================
// Todo pasa por /api/rpc con la sesión. El servidor sabe quién sos por la sesión, no por lo que mande el celular.
async function llamar(fn, args) {
  const h = { 'content-type': 'application/json' };
  if (SB) { const { data } = await SB.auth.getSession(); if (data.session) h.authorization = 'Bearer ' + data.session.access_token; }
  let r;
  try { r = await fetch('/api/rpc', { method: 'POST', headers: h, body: JSON.stringify({ fn, args: args || [] }) }); }
  catch (e) { throw new Error('Sin conexión. Revisá internet y probá de nuevo.'); }
  const j = await r.json().catch(() => ({ error: 'Respuesta rara del servidor' }));
  if (r.status === 401 && j.sesion === false) { await SB.auth.signOut(); login(); throw new Error(j.error); }
  if (!r.ok) throw new Error(j.error || 'Algo falló');
  return j.ok;
}
function run(fn, args, ok, errId, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Un momento…'; }
  const fin = () => { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } };
  llamar(fn, args).then(r => { fin(); ok(r); })
    .catch(e => { fin(); if (errId && $(errId)) $(errId).textContent = e.message; else alert(e.message); });
}
function view(h) { $('app').innerHTML = h; window.scrollTo(0, 0); }
function cargando(t) { view('<p class="mu">' + (t || 'Cargando…') + '</p>'); }
function abrir(h) { $('mc').innerHTML = h; $('modal').classList.remove('hide'); }
function cerrar() { $('modal').classList.add('hide'); }
$('modal').onclick = e => { if (e.target.id === 'modal') cerrar(); };
const volver = (t, fn) => `<button class="mini" onclick="${fn || 'cargar()'}">← ${t || 'Inicio'}</button>`;
// Logo: si todavía no está el archivo, muestra el nombre en texto
const marca = () => `<div class="marca"><picture><source srcset="/logo-service-oscuro.png" media="(prefers-color-scheme: dark)"><img src="/logo-service-claro.png" alt="Autoinfinity Service"></picture></div>`;

// Achica la foto antes de mandarla (más rápido y más barato)
function achicar(archivo, max) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, (max || 1200) / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.8);
      ok({ url, base64: url.split(',')[1] });
    };
    img.onerror = () => mal(new Error('No pude abrir esa foto'));
    img.src = URL.createObjectURL(archivo);
  });
}

// ================= INGRESO (código de 6 números por mail) =================
function login() {
  view(`<div class="top">${marca()}</div>
    <p class="mu" style="margin-bottom:20px">Tu auto, siempre al día.</p>
    <div class="card">
      <label>Tu email</label>
      <input id="em" type="email" placeholder="nombre@mail.com" autocomplete="email" inputmode="email" value="${esc(LOGIN_EMAIL)}">
      <div class="err" id="er"></div>
      <button class="p" onclick="pedirCodigo(this)">Recibir código</button>
      <p class="mu" style="margin-bottom:0">Te mandamos un código de 6 números a tu mail. Es gratis, no hace falta contraseña.</p>
    </div>`);
}
async function pedirCodigo(b) {
  const email = $('em').value.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('er').textContent = 'Poné un email válido'; return; }
  b.disabled = true; b.textContent = 'Mandando…';
  const { error } = await SB.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
  b.disabled = false; b.textContent = 'Recibir código';
  if (error) { $('er').textContent = /rate|seconds/i.test(error.message) ? 'Esperá un minuto y pedí el código de nuevo.' : 'No pudimos mandar el código: ' + error.message; return; }
  LOGIN_EMAIL = email;
  view(`<div class="top">${marca()}</div>
    <div class="card">
      <p style="margin-top:0">Te mandamos un código a <b>${esc(email)}</b>. Revisá también la carpeta de spam.</p>
      <input id="cod" class="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="······">
      <div class="err" id="er"></div>
      <button class="p" onclick="verificar(this)">Entrar</button>
      <button class="s" style="margin-top:10px" onclick="login()">Cambiar de mail o pedir otro código</button>
    </div>`);
  $('cod').focus();
  $('cod').oninput = () => { if (digitos($('cod').value).length >= 6) verificar($('cod').nextElementSibling.nextElementSibling); };
}
async function verificar(b) {
  const token = digitos($('cod').value);
  if (token.length < 6) { $('er').textContent = 'Son 6 números'; return; }
  b.disabled = true; b.textContent = 'Entrando…';
  const { error } = await SB.auth.verifyOtp({ email: LOGIN_EMAIL, token, type: 'email' });
  b.disabled = false; b.textContent = 'Entrar';
  if (error) { $('er').textContent = 'Código incorrecto o vencido. Pedí uno nuevo si hace falta.'; return; }
  cargar();
}
async function salir() { cerrar(); await SB.auth.signOut(); login(); }
function cargar() { cargando(); run('inicio', [], d => { setD(d); if (!d.perfil.nombre) pedirNombre(); }); }
function setD(d) { D = d; cerrar(); home(); }
function pedirNombre() {
  abrir(`<h2>¡Bienvenido!</h2><p class="mu">¿Cómo te llamás?</p>
    <input id="pn1" placeholder="Tu nombre" autocomplete="given-name">
    <div class="err" id="me"></div>
    <button class="p" onclick="run('guardarPerfil',[Object.assign({},D.perfil,{nombre:$('pn1').value.trim()})],setD,'me',this)">Listo</button>`);
}

// ================= INICIO =================
function home() {
  let h = `<div class="top">${marca()}</div>`;
  // Pedidos agrupados: cada grupo es una carpeta que se abre al tocarla
  [['listo', '📋 Informes listos', true], ['esperando', '⏳ Esperando cotizaciones', false], ['calificar', '⭐ Para calificar', false]].forEach(([g, nombre, abierto]) => {
    const lista = D.activos.filter(c => c.grupo === g);
    if (!lista.length) return;
    h += `<details class="grupo" ${abierto || D.activos.length <= 2 ? 'open' : ''}><summary><b>${nombre}<span class="cnt">${lista.length}</span></b><span class="mu">▾</span></summary>` +
      lista.map(c => `<div class="linea" onclick="abrirCaso('${c.id}')"><b>${esc(c.titulo)}</b>
        <span class="mu" style="text-align:right;white-space:nowrap">${g === 'esperando' && c.modo !== 'urgente' && c.venceMs
          ? `<span class="reloj" data-vence="${c.venceMs}">${falta(c.venceMs)}</span>` : esc(c.estadoTexto)}</span></div>`).join('') + `</details>`;
  });
  if (!D.autos.length) {
    h += `<div class="card"><p style="margin-top:0">Todavía no cargaste ningún auto.</p>
      <button class="p" onclick="formAuto()">Agregar mi auto</button></div>`;
  }
  // Cada auto: un solo botón. Al tocar el auto se abren las demás opciones.
  D.autos.forEach(a => {
    const pct = Math.max(2, Math.min(100, (10000 - a.faltanKm) / 100));
    h += `<div class="card">
      <div class="tap" onclick="menuAuto('${a.id}')">
        <div class="fila"><span class="mu">${esc(a.marca)} ${esc(a.modelo)} ${esc(a.anio)}</span><span class="mu">•••</span></div>
        <div class="km">${fmt(a.kmEstimado)} km</div>
        <div class="mu">estimados · última carga ${a.ultimaLectura}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div>Próximo service: <b>${fmt(a.proximoService)} km</b></div>
        <div class="mu">Faltan ${fmt(a.faltanKm)} km · unos ${a.faltanDias} días</div>
      </div>
      ${a.pedirLectura ? `<div class="aviso">Hace ${a.diasSinCargar} días que no cargás los km.</div>` : ''}
      <button class="s" style="margin-top:12px" onclick="formKm('${a.id}')">Actualizar km</button>
      ${a.mostrarService ? `<button class="p" style="margin-top:8px" onclick="cotizarService('${a.id}', this)">Cotizar el service de los ${fmt(a.proximoService)} km</button>` : ''}
    </div>`;
  });
  h += `<button class="big" onclick="nuevoInfi('problema')">Tengo un problema</button>
    <button class="big alt" onclick="nuevoInfi('presupuesto')">Pedir presupuesto</button>
    <div class="pie"><button class="s" onclick="verHistorial()">Historial</button><button class="s" onclick="menuPerfil()">Perfil</button></div>`;
  view(h);
}
function menuAuto(id) {
  const a = D.autos.find(x => x.id === id);
  abrir(`<h2>${esc(a.marca)} ${esc(a.modelo)} ${esc(a.anio)}</h2>
    <p class="mu">Duerme en: ${esc(a.direccion)}</p>
    <div class="menu">
      <button class="s" onclick="formKm('${id}')">📷 Actualizar km</button>
      <button class="s" onclick="cotizarService('${id}', this)">🔧 Cotizar el service de los ${fmt(a.proximoService)} km</button>
      <button class="s" onclick="formCompartir('${id}')">👥 Compartir con otra persona</button>
      <button class="s" onclick="formAuto()">＋ Agregar otro auto</button>
    </div>`);
}
function menuPerfil() {
  abrir(`<h2>Perfil</h2><p class="mu">${esc(D.email || '')}</p>
    <div class="menu">
      <button class="s" onclick="formPerfil()">👤 Mis datos, mecánico y seguro</button>
      <button class="s" onclick="formContacto()">✉️ Contactanos</button>
      ${D.admin ? `<button class="s" onclick="verAdmin()">🛠 Panel Autoinfinity</button>` : ''}
      <button class="s" onclick="salir()">Salir</button>
    </div>`);
}

// ================= AUTOS =================
function formAuto() {
  abrir(`<h2>Agregar auto</h2>
    <input id="ma" placeholder="Marca (ej: Toyota)">
    <input id="mo" placeholder="Modelo (ej: Corolla)">
    <input id="an" type="number" inputmode="numeric" placeholder="Año">
    <input id="kmi" type="number" inputmode="numeric" placeholder="Kilómetros actuales">
    <label>¿Dónde duerme el auto? (para buscar talleres cerca)</label>
    <input id="di" placeholder="Calle, número y localidad">
    <div class="err" id="me"></div>
    <button class="p" onclick="guardarAuto(this)">Guardar</button>`);
}
function guardarAuto(b) {
  const d = { marca: $('ma').value.trim(), modelo: $('mo').value.trim(), anio: $('an').value,
              km: $('kmi').value, direccion: $('di').value.trim() };
  run('agregarAuto', [d], setD, 'me', b);
}

// Kilómetros: foto del tablero (Infi lee el número) o a mano. La foto no se guarda.
function formKm(id) {
  const a = D.autos.find(x => x.id === id);
  abrir(`<h2>Actualizar kilómetros</h2>
    <p class="mu">${esc(a.marca)} ${esc(a.modelo)} · último cargado: ${fmt(a.kmUltimo)} km</p>
    <label class="btnfile p">📷 Sacar foto del tablero<input type="file" accept="image/*" capture="environment" class="hide" onchange="fotoTablero('${id}',this)"></label>
    <p class="mu" style="text-align:center">Con el auto en contacto, que se vea el kilometraje total.</p>
    <div id="lectura"></div>
    <label style="margin-top:14px">O escribilo a mano</label>
    <input id="kmn" type="number" inputmode="numeric" placeholder="Ej: ${a.kmEstimado}">
    <div class="err" id="me"></div>
    <button class="p" onclick="guardarKm('${id}', this, 'manual')">Guardar</button>`);
}
async function fotoTablero(id, inp) {
  const fl = inp.files[0]; if (!fl) return;
  $('lectura').innerHTML = '<p class="mu">Infi está leyendo el tablero…</p>'; $('me').textContent = '';
  try {
    const f = await achicar(fl, 1600);
    const r = await llamar('leerTablero', [id, f.base64]);
    if (!r.km) { $('lectura').innerHTML = `<div class="aviso">${esc(r.nota || 'No pude leer el número. Probá con otra foto o escribilo a mano.')}</div>`; return; }
    $('kmn').value = r.km;
    $('lectura').innerHTML = `<div class="card" style="margin-top:10px"><p style="margin-top:0">Leí <b>${fmt(r.km)} km</b>${r.esTotal ? '' : ' (no estoy segura de que sea el total)'}. ¿Es correcto?</p>
      ${r.nota ? `<p class="mu">${esc(r.nota)}</p>` : ''}
      <button class="p" onclick="guardarKm('${id}', this, 'foto')">Sí, guardar ${fmt(r.km)} km</button>
      <p class="mu" style="margin-bottom:0">Si no, corregilo abajo y tocá Guardar.</p></div>`;
  } catch (e) { $('lectura').innerHTML = ''; $('me').textContent = e.message; }
}
function guardarKm(id, b, fuente, confirmado) {
  run('cargarKm', [id, $('kmn').value, fuente, !!confirmado], r => {
    if (r.revisar) {
      $('lectura').innerHTML = `<div class="aviso">${esc(r.revisar)}<br>
        <button class="p" style="margin-top:8px" onclick="guardarKm('${id}', this, '${fuente}', true)">Sí, es correcto</button></div>`;
      return;
    }
    setD(r);
  }, 'me', b);
}
function formCompartir(id) {
  abrir(`<h2>Compartir auto</h2>
    <p class="mu">La otra persona va a ver este auto y podrá usar la app con él. Tiene que entrar con este mismo email.</p>

// ================= CUENTA REGRESIVA =================
function falta(ms) {
  let m = Math.max(0, Math.round((ms - Date.now()) / 60000));
  if (!m) return 'llegando…';
  const d = Math.floor(m / 1440), hs = Math.floor((m % 1440) / 60), mi = m % 60;
  return 'faltan ' + (d ? d + ' d ' : '') + (d || hs ? hs + ' h ' : '') + mi + ' min';
}
setInterval(() => document.querySelectorAll('[data-vence]').forEach(el => el.textContent = falta(Number(el.dataset.vence))), 30000);

// ================= PANEL PARA COMPARAR PRESUPUESTOS =================
// Todos los presupuestos en un solo cuadro: se comparan de un vistazo y se ordenan sin entrar y salir.
let ABIERTA = null, FILTRO = 'todos';
const reputacion = q => q.interna && !q.interna.faltan ? q.interna.prom : (q.rating || 0);
const cantResenas = q => (q.interna && !q.interna.faltan ? q.interna.n : 0) + (q.resenas || 0);
function fechaCorta(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00'), hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  const dias = Math.round((d - hoy) / 864e5);
  if (dias <= 0) return 'Hoy';
  if (dias === 1) return 'Mañana';
  return d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'numeric' });
}
const ORDENES = [['precio', 'Precio'], ['cerca', 'Cercanía'], ['tiempo', 'Tiempo'], ['reputacion', 'Reputación']];
function ordenar(cs) {
  const ult = v => v == null ? 1e15 : v;
  if (ORDEN === 'precio') cs.sort((a, b) => ult(a.precio || null) - ult(b.precio || null));
  if (ORDEN === 'cerca') cs.sort((a, b) => ult(a.distancia) - ult(b.distancia));
  if (ORDEN === 'tiempo') cs.sort((a, b) => ult(a.disponible ? Date.parse(a.disponible) : null) - ult(b.disponible ? Date.parse(b.disponible) : null));
  if (ORDEN === 'reputacion') cs.sort((a, b) => (reputacion(b) - reputacion(a)) || (cantResenas(b) - cantResenas(a)));
  return cs;
}
// Etiquetas para ver al toque quién gana en qué
function etiquetas(cs) {
  const t = {}, poner = (q, txt) => { if (q) (t[q.placeId] = t[q.placeId] || []).push(txt); };
  const con = f => cs.filter(f);
  const min = (arr, f) => arr.reduce((m, q) => (m == null || f(q) < f(m)) ? q : m, null);
  const max = (arr, f) => arr.reduce((m, q) => (m == null || f(q) > f(m)) ? q : m, null);
  if (cs.length > 1) {
    poner(min(con(q => q.precio), q => q.precio), 'Más barato');
    poner(min(con(q => q.disponible), q => Date.parse(q.disponible)), 'Más rápido');
    poner(max(con(q => reputacion(q)), q => reputacion(q) * 100 + Math.min(cantResenas(q), 99)), 'Mejor puntuado');
    poner(min(con(q => q.distancia != null), q => q.distancia), 'Más cerca');
    // Recomendado: el más barato entre los bien puntuados (4,3 o más con reseñas suficientes)
    poner(min(con(q => q.precio && reputacion(q) >= 4.3 && cantResenas(q) >= 10), q => q.precio), '👍 Recomendado');
  }
  return t;
}
function panelComparar() {
  const todas = CASO.cotizaciones.slice();
  const hayOficiales = todas.some(q => q.oficial) && todas.some(q => !q.oficial);
  const cs = ordenar(todas.filter(q => FILTRO === 'todos' || (FILTRO === 'oficial') === !!q.oficial));
  const tags = etiquetas(todas);
  let h = `<div class="card comp"><div class="fila"><h2 style="margin:0">Presupuestos</h2><span class="mu">${todas.length} talleres</span></div>
    <div class="mu" style="margin-top:6px">Ordenar por</div>
    <div class="chips" style="margin-top:6px">` + ORDENES.map(([k, t]) =>
      `<button class="chip mini2 ${ORDEN === k ? 'on' : ''}" onclick="ORDEN='${k}';ABIERTA=null;repintar()">${t}</button>`).join('') + `</div>`;
  if (hayOficiales) h += `<div class="chips" style="margin-top:0">` + [['todos', 'Todos'], ['oficial', 'Oficiales'], ['otros', 'Lubricentros y talleres']].map(([k, t]) =>
      `<button class="chip mini2 ${FILTRO === k ? 'on' : ''}" onclick="FILTRO='${k}';ABIERTA=null;repintar()">${t}</button>`).join('') + `</div>`;
  h += cs.map(q => {
    const abierta = ABIERTA === q.placeId;
    const rep = q.interna && !q.interna.faltan ? `★ ${q.interna.prom} Autoinfinity (${q.interna.n})` : q.rating ? `★ ${q.rating} (${q.resenas})` : 'Sin reseñas';
    const cuando = q.disponible ? '📅 ' + fechaCorta(q.disponible) : (q.cuando ? '📅 ' + q.cuando : '');
    return `<div class="cot ${abierta ? 'abierta' : ''}">
      <div class="tap" onclick="ABIERTA=${abierta ? 'null' : `'${q.placeId}'`};repintar()">
        <div class="fila"><b>${esc(q.nombre)}${q.oficial ? ' <span class="of">Oficial</span>' : ''}</b><b class="precio">${money(q.precio)}</b></div>
        <div class="mu">${rep}${q.distancia != null ? ' · ' + q.distancia + ' km' : ''}${cuando ? ' · ' + esc(cuando) : ''}</div>
        ${(tags[q.placeId] || []).length ? `<div class="tags">${tags[q.placeId].map(x => `<span>${x}</span>`).join('')}</div>` : ''}
      </div>
      ${abierta ? `<div class="det">
        ${q.incluye ? `<p><b>Incluye:</b> ${esc(q.incluye)}</p>` : ''}
        ${q.cuando ? `<p><b>Cuándo:</b> ${esc(q.cuando)}</p>` : ''}
        ${q.rubro ? `<p class="mu">${esc(q.rubro)}</p>` : ''}
        <p class="mu">📍 ${esc(q.direccion)}</p>
        ${bloqueResenas(q.interna)}
        ${q.googleId ? `<a href="${fichaGoogle(q)}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:600;font-size:14px">Ver reseñas y fotos en Google</a>` : ''}
        <div class="row">
          <a class="btn s" href="${waLink(q.telefono, 'Hola! Vengo de Autoinfinity Service por el presupuesto de: ' + CASO.titulo)}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn s" href="${telLink(q.telefono)}">Llamar</a></div>
        ${CASO.estado === 'listo' || CASO.estado === 'cotizando' ? `<button class="p" style="margin-top:8px" onclick="elegir('${q.placeId}',this)">Elegir este taller</button>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');
  return h + `<p class="mu" style="margin-bottom:0">Tocá un taller para ver el detalle, contactarlo o elegirlo.</p></div>`;
}

function estrellas(n) {
  ESTRELLAS = n;
  $('st').innerHTML = [1,2,3,4,5].map(i => `<button onclick="estrellas(${i})">${i <= n ? '★' : '☆'}</button>`).join('');
}
let FOTO_CALIF = null;
async function fotoCalif(inp) {
  const fl = inp.files[0]; if (!fl) return;
  try { const f = await achicar(fl, 1200); FOTO_CALIF = f.base64; $('pvc').src = f.url; $('pvc').classList.remove('hide'); }
  catch (e) { $('me').textContent = e.message; }
}
function enviarCalif(b) {
  if (!ESTRELLAS) { $('me').textContent = 'Tocá las estrellas'; return; }
  run('calificar', [CASO.id, ESTRELLAS, $('cm').value.trim(), FOTO_CALIF], c => { FOTO_CALIF = null; pintarCaso(c); }, 'me', b);
}

// ================= HISTORIAL =================
function verHistorial() {
  cargando();
  run('historial', [], lista => {
    let h = `<div class="top">${volver()}</div><h2>Historial</h2>`;
    if (!lista.length) h += `<p class="mu">Todavía no hay nada. Acá va a quedar todo lo que hagas con tu auto.</p>`;
    const icono = { problema: '⚠️', presupuesto: '🧾', service: '🔧' };
    lista.forEach(c => {
      h += `<div class="card tap" onclick="abrirCaso('${c.id}')">
        <div class="fila"><b>${icono[c.tipo] || ''} ${esc(c.titulo)}</b></div>
        <div class="mu">${esc(c.auto)} · ${c.fecha}</div></div>`;
    });
    view(h);
  });
}

// ================= PANEL AUTOINFINITY =================
const estadoEnv = e => ({ pendiente: 'Sin enviar', enviado: 'Enviado', respondio: 'Respondió ✓', 'no cotiza': 'No cotiza' }[e] || e);
let AQUI = null;
// Mapa con el pin del taller (no la ruta) y link a su ficha de Google con reseñas y fotos
const mapaEmbed = e => 'https://maps.google.com/maps?q=' + encodeURIComponent(e.nombre + ', ' + (e.direccion || (e.lat + ',' + e.lng))) + '&z=15&output=embed';
function kmEntre(a, b) {
  const r = x => x * Math.PI / 180, h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return Math.round(2 * 6371 * Math.asin(Math.sqrt(h)) * 10) / 10;
}
function verAdmin() {
  cerrar(); cargando();
  let listo = false;
  const seguir = () => { if (listo) return; listo = true; run('panelAdmin', [], pintarAdmin); };
  try {
    navigator.geolocation.getCurrentPosition(p => { AQUI = { lat: p.coords.latitude, lng: p.coords.longitude }; seguir(); },
      () => seguir(), { timeout: 6000, maximumAge: 300000 });
    setTimeout(seguir, 7000);
  } catch (e) { seguir(); }
}
function pintarAdmin(d) {
  cerrar();
  let h = `<div class="top">${volver()}<button class="mini" onclick="verAdmin()">Actualizar</button></div><h2>Panel Autoinfinity</h2>`;
  const w = d.whatsapp || {};
  h += `<p class="mu">WhatsApp automático: ${w.configurado ? (w.prueba ? '<b>modo prueba</b> (los mensajes te llegan a vos)' : '<b>activo</b>') : 'sin configurar (se mandan a mano)'}</p>`;
  if (!AQUI) h += `<p class="mu">No pude saber dónde estás (permiso de ubicación). Las distancias son desde donde duerme el auto.</p>`;
  if (!d.pedidos.length && !d.cierres.length) h += `<p class="mu">No hay nada pendiente.</p>`;
  // Base de talleres por zona
  const b = d.base || { zonas: [], invitarWa: [], anotados: 0 };
  h += `<details class="grupo"><summary><b>🗺️ Base de talleres<span class="cnt">${b.anotados}</span></b><span class="mu">▾</span></summary>
    <p class="mu">Cada zona sale de donde duerme el auto de un cliente. Todos los días se busca un rubro por zona hasta tener 5 anotados por rubro.</p>` +
    b.zonas.map(z => `<div class="env"><div class="fila"><b>${esc(z.nombre)}</b>
      <button class="mini" onclick="run('reclutarAhora',['${z.id}'],pintarAdmin,null,this)">Buscar ahora</button></div>
      <div class="chips">` + z.rubros.map(r => `<span class="chip" style="cursor:default;font-size:13px;padding:5px 10px;${r.anotados >= 5 ? 'background:var(--ac);color:#fff' : r.buscado ? '' : 'opacity:.5'}">
        ${esc(r.rubro)} ${r.anotados}/5${r.km > 8 ? ' · ' + r.km + 'km' : ''}</span>`).join('') + `</div></div>`).join('') +
    `<div class="row"><input id="nz" placeholder="Sumar zona: dirección o barrio" style="margin:0"><button class="mini" onclick="run('agregarZona',[$('nz').value],pintarAdmin,null,this)">Sumar</button></div></details>`;
  if (b.invitarWa.length) {
    h += `<details class="grupo"><summary><b>📲 Invitar por WhatsApp<span class="cnt">${b.invitarWa.length}</span></b><span class="mu">▾</span></summary>
      <p class="mu">Talleres sin mail. El mensaje lleva un link para que se anoten solos.</p>` +
      b.invitarWa.map(t => `<div class="env fila"><span><b>${esc(t.nombre)}</b><br><span class="mu">${esc(t.tipo)} · ${esc(t.telefono)}</span></span>
        <a class="btn s" style="width:auto;margin:0;padding:9px 14px" href="${t.wa}" target="_blank" rel="noopener" onclick="llamar('marcarInvitado',['${t.placeId}']);this.textContent='Enviado ✓'">WhatsApp</a></div>`).join('') + `</details>`;
  }
  d.pedidos.forEach(p => {
    const auto = p.autoLat ? { lat: p.autoLat, lng: p.autoLng } : null;
    const pendientes = p.envios.filter(e => e.estado === 'pendiente' && e.celular).length;
    h += `<div class="card"><div class="mu">${p.modo === 'urgente' ? '<b style="color:var(--rojo)">URGENTE</b> · ' : ''}vence ${p.vence} · ${esc(p.auto)}</div>
      <div class="fila"><b>${esc(p.titulo)}</b><span class="tap" style="color:var(--ac);font-size:14px" onclick="abrirCaso('${p.casoId}')">ver</span></div>
      ${w.configurado && pendientes ? `<button class="s" style="margin-top:8px" onclick="run('reenviarWhatsApp',['${p.casoId}'],pintarAdmin,null,this)">Mandar WhatsApp a los ${pendientes} pendientes</button>` : ''}`;
    p.envios.forEach(e => {
      const dest = e.lat ? { lat: e.lat, lng: e.lng } : null;
      const desde = AQUI || auto;
      const km = dest && desde ? kmEntre(desde, dest) : null;
      h += `<div class="env"><div class="fila"><b>${esc(e.nombre)}</b><span class="mu">${estadoEnv(e.estado)}</span></div>
        <div style="margin:4px 0">${e.lista === 'si' ? '<span class="badge" style="background:var(--ac)">En la lista ✓</span>'
          : e.primeraVez ? '<span class="badge" style="background:var(--wa)">Nuevo · va con presentación</span>' : ''}</div>
        ${e.waError ? `<div class="mu" style="color:var(--rojo)">WhatsApp: ${esc(e.waError)}</div>` : ''}
        ${e.rating ? `<div class="mu">⭐ ${e.rating} (${e.resenas} reseñas)</div>` : ''}
        <div class="mu">${e.telefono ? (e.celular ? '📱 Celular / WhatsApp: ' : '☎️ Fijo: ') + esc(e.telefono) : 'Sin teléfono'}</div>
        ${e.direccion ? `<div class="mu">📍 ${esc(e.direccion)}</div>` : ''}
        ${km != null ? `<div class="mu">🚗 a ${km} km ${AQUI ? 'de donde estás' : 'de donde duerme el auto'}${AQUI && e.kmAuto != null ? ' · ' + e.kmAuto + ' km del auto' : ''}</div>` : ''}
        ${dest ? `<iframe src="${mapaEmbed(e)}" loading="lazy" style="width:100%;height:170px;border:0;border-radius:12px;margin:8px 0"></iframe>` : ''}
        ${e.googleId ? `<a href="${fichaGoogle(e)}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:600;font-size:14px">Ver reseñas y fotos en Google Maps</a>` : ''}`;
      if (e.estado === 'pendiente' || e.estado === 'enviado') {
        h += `<div class="row">
          ${e.wa ? `<a class="btn s" href="${e.wa}" target="_blank" rel="noopener" onclick="marcar('${p.casoId}','${e.placeId}','enviado',false)">WhatsApp</a>` : ''}
          ${e.telefono ? `<a class="btn s" href="${e.tel}" onclick="marcar('${p.casoId}','${e.placeId}','enviado',false)">Llamar</a>` : ''}
          <button class="s" onclick="formResp('${p.casoId}','${e.placeId}')">Respuesta</button>
          <button class="s" onclick="marcar('${p.casoId}','${e.placeId}','no cotiza',true)">No cotiza</button></div>`;
      }
      if (e.lista !== 'si' && e.googleId) {
        h += `<div class="row"><button class="s" onclick="run('marcarLista',['${e.placeId}','si'],pintarAdmin,null,this)">✓ Se suma a la lista</button>
          <button class="s" onclick="if(confirm('¿Lista negra? No le vamos a escribir más.'))run('marcarLista',['${e.placeId}','no'],pintarAdmin,null,this)">✕ No quiere</button></div>`;
      }
      h += `</div>`;
    });
    h += `<button class="s" style="margin-top:10px" onclick="formTaller('${p.casoId}')">+ Agregar taller a mano</button></div>`;
  });
  d.cierres.forEach(c => {
    h += `<div class="card"><div class="mu">Avisar que se cerró</div><b>${esc(c.titulo)}</b>`;
    c.talleres.forEach(t => {
      h += `<div class="env fila"><span>${esc(t.nombre)}</span>${t.wa ? `<a href="${t.wa}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:600">WhatsApp</a>` : ''}</div>`;
    });
    h += `<button class="p" style="margin-top:10px" onclick="run('marcarAvisado',['${c.casoId}'],pintarAdmin,null,this)">Listo, avisados</button></div>`;
  });
  view(h);
}
function marcar(casoId, placeId, estado, repintar) {
  llamar('marcarEnvio', [casoId, placeId, estado]).then(d => { if (repintar) pintarAdmin(d); }).catch(e => alert(e.message));
}
function formResp(casoId, placeId) {
  abrir(`<h2>Respuesta del taller</h2>
    <p class="mu">Copiá lo que te contestó el taller por WhatsApp y pegalo acá. Infi saca el precio, cuándo y qué incluye.</p>
    <textarea id="rt" rows="5"></textarea><div class="err" id="me"></div>
    <button class="p" onclick="run('cargarRespuesta',['${casoId}','${placeId}',$('rt').value],pintarAdmin,'me',this)">Guardar</button>`);
}
function formTaller(casoId) {
  abrir(`<h2>Agregar taller a mano</h2>
    <input id="tn" placeholder="Nombre del taller">
    <input id="tt" type="tel" placeholder="WhatsApp con código de área (ej: 11 5555 5555)">
    <div class="err" id="me"></div>
    <button class="p" onclick="run('agregarTallerManual',['${casoId}',$('tn').value,$('tt').value],pintarAdmin,'me',this)">Agregar</button>`);
}

// ================= ARRANQUE =================
(async function () {
  try {
    const cfg = await llamar('config');
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Falta configurar Supabase en el servidor');
    SB = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    const { data } = await SB.auth.getSession();
    if (!data.session) return login();
    // Link del mail de "actualizá los kilómetros": abre directo la carga de km
    const kmAuto = new URLSearchParams(location.search).get('km');
    cargando();
    run('inicio', [], d => {
      setD(d);
      if (!d.perfil.nombre) pedirNombre();
      else if (kmAuto && d.autos.some(a => a.id === kmAuto)) formKm(kmAuto);
      if (kmAuto) history.replaceState(null, '', '/');
    });
  } catch (e) {
    view(`<div class="card"><b>No pudimos abrir la app</b><p class="mu">${esc(e.message)}</p><button class="p" onclick="location.reload()">Probar de nuevo</button></div>`);
  }
})();
